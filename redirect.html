<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss: *.supabase.co;">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        
        .loader-container {
            text-align: center;
            padding: 2rem;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .message {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        
        .sub-message {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .error-container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
        }
        
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .error-description {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .password-form {
            margin-top: 1.5rem;
        }
        
        .input-group {
            margin-bottom: 1rem;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        input[type="password"]:focus {
            outline: none;
            border-color: white;
        }
        
        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loader-container">
            <div class="loader"></div>
            <div class="message">Redirecting...</div>
            <div class="sub-message">Please wait a moment</div>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <script>
        // Get short code from URL
        function getShortCode() {
            const path = window.location.pathname;
            // Remove leading slash and get the code
            const code = path.substring(1).split('/')[0];
            return code || null;
        }

        // Get user's device information
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let deviceType = 'desktop';
            let browser = 'Unknown';
            let os = 'Unknown';

            // Detect device type
            if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) {
                deviceType = 'mobile';
            } else if (/Tablet|iPad/.test(ua)) {
                deviceType = 'tablet';
            }

            // Detect browser
            if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Safari')) browser = 'Safari';
            else if (ua.includes('Edge')) browser = 'Edge';
            else if (ua.includes('MSIE') || ua.includes('Trident/')) browser = 'Internet Explorer';

            // Detect OS
            if (ua.includes('Windows')) os = 'Windows';
            else if (ua.includes('Mac')) os = 'macOS';
            else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('Android')) os = 'Android';
            else if (ua.includes('iOS') || ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';

            return { deviceType, browser, os };
        }

        // Hash password for verification
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Show error message
        function showError(title, description, showHomeButton = true) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="error-container">
                    <div class="error-icon">⚠️</div>
                    <div class="error-title">${title}</div>
                    <div class="error-description">${description}</div>
                    ${showHomeButton ? '<a href="/" class="btn">Go to Homepage</a>' : ''}
                </div>
            `;
        }

        // Show password prompt
        function showPasswordPrompt(urlData) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="error-container">
                    <div class="error-icon">🔒</div>
                    <div class="error-title">Password Required</div>
                    <div class="error-description">This URL is password protected. Please enter the password to continue.</div>
                    <form class="password-form" id="passwordForm">
                        <div class="input-group">
                            <input type="password" id="passwordInput" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="submit-btn">Submit</button>
                    </form>
                </div>
            `;

            document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('passwordInput').value;
                const submitBtn = e.target.querySelector('.submit-btn');
                
                submitBtn.disabled = true;
                submitBtn.textContent = 'Verifying...';

                try {
                    const hashedPassword = await hashPassword(password);
                    
                    if (hashedPassword === urlData.password_hash) {
                        // Password correct, proceed with redirect
                        await performRedirect(urlData, password);
                    } else {
                        // Password incorrect
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Submit';
                        document.getElementById('passwordInput').value = '';
                        document.getElementById('passwordInput').focus();
                        
                        const errorMsg = document.createElement('div');
                        errorMsg.style.color = '#ff6b6b';
                        errorMsg.style.marginTop = '0.5rem';
                        errorMsg.textContent = 'Incorrect password. Please try again.';
                        document.querySelector('.password-form').appendChild(errorMsg);
                        
                        setTimeout(() => errorMsg.remove(), 3000);
                    }
                } catch (error) {
                    console.error('Password verification error:', error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit';
                    showError('Error', 'An error occurred. Please try again.');
                }
            });

            // Focus on password input
            document.getElementById('passwordInput').focus();
        }

        // Track analytics
        async function trackClick(supabase, urlData, variant = 'A') {
            try {
                const deviceInfo = getDeviceInfo();
                
                const { error } = await supabase
                    .from('analytics')
                    .insert([{
                        url_id: urlData.id,
                        user_agent: navigator.userAgent,
                        referrer: document.referrer || null,
                        device_type: deviceInfo.deviceType,
                        browser: deviceInfo.browser,
                        os: deviceInfo.os,
                        variant: variant,
                        clicked_at: new Date().toISOString()
                    }]);

                if (error) {
                    console.error('Analytics tracking error:', error);
                }

                // Increment click count
                await supabase.rpc('increment_click_count', {
                    p_short_code: getShortCode()
                });
            } catch (error) {
                console.error('Error tracking click:', error);
            }
        }

        // Perform the actual redirect
        async function performRedirect(urlData, password = null) {
            const supabase = initSupabase();
            
            // Determine which URL to redirect to (A/B testing)
            let targetUrl = urlData.original_url;
            let variant = 'A';
            
            if (urlData.enable_ab_test && urlData.alternative_url) {
                const random = Math.random() * 100;
                if (random >= urlData.traffic_split) {
                    targetUrl = urlData.alternative_url;
                    variant = 'B';
                }
            }

            // Track the click
            await trackClick(supabase, urlData, variant);

            // Redirect
            window.location.href = targetUrl;
        }

        // Main redirect logic
        async function handleRedirect() {
            const shortCode = getShortCode();
            
            if (!shortCode) {
                showError('Invalid URL', 'No short code provided in the URL.');
                return;
            }

            try {
                // Initialize Supabase
                const supabase = initSupabase();
                
                if (!supabase) {
                    showError('Configuration Error', 'Supabase is not properly configured. Please check your settings.');
                    return;
                }

                // Fetch URL data
                const { data, error } = await supabase
                    .rpc('get_url_by_short_code', {
                        p_short_code: shortCode
                    });

                if (error) {
                    console.error('Database error:', error);
                    showError('Error', 'An error occurred while fetching the URL.');
                    return;
                }

                if (!data || data.length === 0) {
                    showError('URL Not Found', 'This short URL does not exist or has been removed.');
                    return;
                }

                const urlData = data[0];

                // Check if URL is expired
                if (urlData.is_expired || (urlData.expiry_date && new Date(urlData.expiry_date) < new Date())) {
                    showError('URL Expired', 'This short URL has expired and is no longer available.');
                    return;
                }

                // Check if password is required
                if (urlData.is_password_protected) {
                    showPasswordPrompt(urlData);
                    return;
                }

                // Proceed with redirect
                await performRedirect(urlData);

            } catch (error) {
                console.error('Redirect error:', error);
                showError('Error', 'An unexpected error occurred. Please try again later.');
            }
        }

        // Start the redirect process
        handleRedirect();
    </script>
</body>
</html>
